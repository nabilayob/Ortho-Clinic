<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - نظام عيادة العظام</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #12305a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1f2937;
    }
    .card {
      background: #fff;
      width: 90%;
      max-width: 500px;
      border-radius: 20px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }
    h1 {
      margin-bottom: 8px;
      font-size: 28px;
    }
    .subtitle {
      color: #64748b;
      margin-bottom: 30px;
    }
    .roles {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .role {
      border: 1px solid #dbe3ef;
      border-radius: 20px;
      padding: 10px 18px;
      cursor: pointer;
      background: #fff;
    }
    .role.active {
      background: #1e88e5;
      color: white;
      border-color: #1e88e5;
    }
    button.demo {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 18px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(90deg, #1976d2, #14b8a6);
      cursor: pointer;
      margin: 15px 0;
    }
    input {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: 1px solid #dbe3ef;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button.login {
      width: 100%;
      background: #111827;
      color: white;
      border: 0;
      padding: 16px;
      border-radius: 10px;
      margin-top: 10px;
      font-size: 18px;
      cursor: pointer;
    }
    .note {
      margin-top: 20px;
      padding: 15px;
      background: #eef6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      color: #1d4ed8;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>نظام عيادة العظام</h1>
    <div class="subtitle">Ortho Clinic Management System</div>

    <p>اختر الدور للعرض التجريبي:</p>

    <div class="roles">
      <button class="role active" data-role="admin">مدير النظام</button>
      <button class="role" data-role="doctor">طبيب</button>
      <button class="role" data-role="reception">استقبال</button>
      <button class="role" data-role="accountant">حسابات</button>
    </div>

    <button type="button" class="demo" onclick="demoLogin()">🚀 دخول تجريبي فوري</button>

    <p>أو سجّل دخولك بحسابك</p>

    <input id="email" type="email" placeholder="البريد الإلكتروني">
    <input id="password" type="password" placeholder="كلمة المرور">

    <button type="button" class="login" onclick="normalLogin()">تسجيل الدخول</button>

    <div class="note">
      وضع العرض التجريبي: اضغط "دخول تجريبي فوري" للوصول الفوري. يعمل بدون Firebase.
    </div>
  </div>

  <script>
    let selectedRole = "admin";

    document.querySelectorAll(".role").forEach(function(btn) {
      btn.addEventListener("click", function() {
        document.querySelectorAll(".role").forEach(function(b) {
          b.classList.remove("active");
        });
        btn.classList.add("active");
        selectedRole = btn.getAttribute("data-role");
      });
    });

    function demoLogin() {
      localStorage.setItem("ortho_demo_mode", "true");
      localStorage.setItem("ortho_user_role", selectedRole);
      localStorage.setItem("ortho_logged_in", "true");
      window.location.href = "dashboard.html";
    }

    function normalLogin() {
      alert("تسجيل الدخول بالبريد يحتاج Firebase. استخدم زر دخول تجريبي فوري الآن.");
    }
  </script>
</body>
</html>
