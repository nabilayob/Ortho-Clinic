p></div>`).join('')||'<div class="empty">لا توجد نتائج</div>'; q('#progress').innerHTML='<div class="grid-3"><div class="sc"><div class="sl">Pain Score</div><div class="sv">8 → 4</div><div class="bar"><span style="width:55%"></span></div></div><div class="sc"><div class="sl">Range of Motion</div><div class="sv">60% → 82%</div><div class="bar"><span style="width:82%"></span></div></div><div class="sc"><div class="sl">الالتزام</div><div class="sv">90%</div><div class="bar"><span style="width:90%"></span></div></div></div>'; q('#payments').innerHTML=store.payments.filter(x=>x.patientId==p.id).map(x=>`<div class="tl"><b>${x.amount} ج.م</b><div class="mini">${x.date} • ${x.method} • ${x.type}</div></div>`).join('')||'<div class="empty">لا توجد مدفوعات</div>'; q('#messages').innerHTML=store.messages.filter(x=>x.patientId==p.id).map(x=>`<div class="tl"><b>${x.channel}</b><p>${x.message}</p><div class="mini">${x.status} • ${x.date}</div></div>`).join('')||'<div class="empty">لا توجد رسائل</div>'; q('#attachments').innerHTML='<div class="empty"><div class="ei">📎</div>يمكن رفع X-rays / MRI / CT / Lab Results / Receipts من صفحة الأشعة والتحاليل.</div>';}
