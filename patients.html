<a class="nv " href="settings.html"><span class="ni">⚙️</span><span>الإعدادات</span></a></nav><div class="sb-foot"><div class="sb-usr"><div class="av">د</div><div><div class="un">د. أحمد المنصوري</div><div class="ur">مدير النظام</div></div></div></div></aside><main class="main"><header class="topbar"><div class="tb-title">المرضى</div><div class="sp"></div><input class="srch" placeholder="بحث سريع..." oninput="window.pageSearch&&pageSearch(this.value)"><button class="tb-btn" title="تنبيهات">🔔</button><button class="tb-btn" onclick="location.href='login.html'" title="خروج">↩</button></header><section class="pg"><div class="ph"><div><h1>ملفات المرضى</h1><p>تسجيل المرضى والبحث وفتح الملف الكامل.</p></div><button class="btn btn-p" onclick="openModal('patMo')">➕ مريض جديد</button></div><div class="card"><div class="cb2 grid-4"><div class="fg"><label>بحث</label><input id="search" oninput="render()" placeholder="الاسم أو الهاتف"></div><div class="fg"><label>تصنيف</label><select id="rank" onchange="render()"><option value="">كل التصنيفات</option><option>ذهبي</option><option>فضي</option><option>جديد</option></select></div><div class="fg"><label>رصيد مستحق</label><select id="balance" onchange="render()"><option value="">الكل</option><option value="yes">عليه مستحقات</option><option value="no">بدون مستحقات</option></select></div><div class="fg"><label>متابعة</label><select><option>كل الحالات</option><option>مستحق متابعة</option></select></div></div></div><div class="grid-3" id="cards"></div><div class="mo" id="patMo"><div class="md"><div class="mh"><h3>إضافة مريض جديد</h3><button class="mc" onclick="closeModal('patMo')">✕</button></div><div class="mb"><div class="form-row"><div class="fg"><label>الاسم</label><input id="name"></div><div class="fg"><label>الهاتف</label><input id="phone"></div></div><div class="form-row"><div class="fg"><label>العمر</label><input type="number" id="age"></div><div class="fg"><label>النوع</label><select id="gender"><option>ذكر</option><option>أنثى</option></select></div></div><div class="fg"><label>العنوان</label><input id="address"></div><div class="form-row"><div class="fg"><label>الحساسية</label><input id="allergies"></div><div class="fg"><label>أمراض مزمنة</label><input id="chronic"></div></div><div class="fg"><label>أدوية حالية / تاريخ عظام / ملاحظات</label><textarea id="notes"></textarea></div></div><div class="mf"><button class="btn btn-o" onclick="closeModal('patMo')">إلغاء</button><button class="btn btn-p" onclick="savePatient()">حفظ</button></div></div></div></section></main></div><script src="js/optional.js"></script><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import { getFirestore, collection, getDocs, addDoc, setDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";const firebaseConfig={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT_ID.firebaseapp.com",projectId:"YOUR_PROJECT_ID",storageBucket:"YOUR_PROJECT_ID.appspot.com",messagingSenderId:"YOUR_MESSAGING_SENDER_ID",appId:"YOUR_APP_ID"};let fb={online:false,db:null,storage:null};try{const app=initializeApp(firebaseConfig);fb.db=getFirestore(app);fb.storage=getStorage(app);signInAnonymously(getAuth(app)).then(()=>fb.online=true).catch(()=>fb.online=false);}catch(e){fb.online=false;}window.fb=fb;
let store=getStore(); function openModal(id){q('#'+id).classList.add('open')} function closeModal(id){q('#'+id).classList.remove('open')}
function render(){let arr=store.patients.slice(); const s=q('#search').value.trim(), r=q('#rank').value, b=q('#balance').value; if(s)arr=arr.filter(p=>(p.name+p.phone).includes(s)); if(r)arr=arr.filter(p=>p.rank==r); if(b=='yes')arr=arr.filter(p=>Number(p.balance)>0); if(b=='no')arr=arr.filter(p=>Number(p.balance)==0); q('#cards').innerHTML=arr.map(p=>`<div class="card"><div class="cb2"><div style="display:flex;gap:12px;align-items:center;margin-bottom:12px"><div class="av" style="background:#1a6fce">${p.name[0]}</div><div><b>${p.name}</b><div class="mini">${p.phone} • ${p.age} سنة • ${p.gender}</div></div></div><div class="grid-2"><div><span class="mini">التصنيف</span><br><span class="bdg ${p.rank=='ذهبي'?'bo':'bb'}">${p.rank||'جديد'}</span></div><div><span class="mini">المستحقات</span><br><b>${p.balance||0} ج.م</b></div></div><hr style="border:0;border-top:1px solid var(--border);margin:14px 0"><div class="mini">آخر زيارة: ${p.lastVisit||'-'} • عدد الزيارات: ${p.totalVisits||0}</div><div style="margin:10px 0">${p.complaint||'لا توجد شكوى رئيسية'}</div><button class="btn btn-p btn-sm" onclick="location.href='patient-profile.html?id=${p.id}'">فتح الملف</button></div></div>`).join('')||'<div class="empty"><div class="ei">👥</div>لا يوجد مرضى</div>'}
function savePatient(){const p={id:uid('p'),name:q('#name').value,phone:q('#phone').value,age:q('#age').value,gender:q('#gender').value,address:q('#address').value,allergies:q('#allergies').value||'لا يوجد',chronic:q('#chronic').value||'لا يوجد',medications:'',rank:'جديد',lastVisit:'-',balance:0,totalVisits:0,complaint:q('#notes').value}; store.patients.push(p); saveStore(store); closeModal('patMo'); render();}
window.render=render; window.savePatient=savePatient; window.openModal=openModal; window.closeModal=closeModal; render();
</script></body></html>
