<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الروشتات — عيادة العظام</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div class="shell"><aside class="sidebar"><div class="sb-logo"><div class="logo-ic">🦴</div><div class="logo-tx"><strong>Ortho Clinic</strong><span>نظام عيادة العظام</span></div></div><nav class="sb-nav"><div class="sb-sec">النظام</div><a class="nv " href="dashboard.html"><span class="ni">📊</span><span>لوحة التحكم</span></a>

<a class="nv " href="settings.html"><span class="ni">⚙️</span><span>الإعدادات</span></a></nav><div class="sb-foot"><div class="sb-usr"><div class="av">د</div><div><div class="un">د. أحمد المنصوري</div><div class="ur">مدير النظام</div></div></div></div></aside><main class="main"><header class="topbar"><div class="tb-title">الروشتات</div><div class="sp"></div><input class="srch" placeholder="بحث سريع..." oninput="window.pageSearch&&pageSearch(this.value)"><button class="tb-btn" title="تنبيهات">🔔</button><button class="tb-btn" onclick="location.href='login.html'" title="خروج">↩</button></header><section class="pg"><div class="ph"><div><h1>الروشتات</h1><p>إنشاء روشتة سريعة من مكتبة أدوية وقوالب وطباعتها.</p></div><button class="btn btn-p" onclick="openModal('rxMo')">➕ روشتة جديدة</button></div><div id="rxList"></div><div class="mo" id="rxMo"><div class="md"><div class="mh"><h3>روشتة جديدة</h3><button class="mc" onclick="closeModal('rxMo')">✕</button></div><div class="mb"><div class="form-row"><div class="fg"><label>المريض</label><select id="patient"></select></div><div class="fg"><label>القالب</label><select onchange="applyTemplate(this.value)"><option value="">بدون</option><option value="pain">مسكن ومضاد التهاب</option><option value="oa">خشونة الركبة</option></select></div></div><div id="items"></div><button class="btn btn-o" onclick="addItem()">➕ إضافة دواء</button><div class="fg" style="margin-top:14px"><label>تعليمات عامة</label><textarea id="notes"></textarea></div></div><div class="mf"><button class="btn btn-o" onclick="closeModal('rxMo')">إلغاء</button><button class="btn btn-p" onclick="saveRx()">حفظ وطباعة</button></div></div></div></section></main></div><script src="js/optional.js"></script><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import { getFirestore, collection, getDocs, addDoc, setDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";const firebaseConfig={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT_ID.firebaseapp.com",projectId:"YOUR_PROJECT_ID",storageBucket:"YOUR_PROJECT_ID.appspot.com",messagingSenderId:"YOUR_MESSAGING_SENDER_ID",appId:"YOUR_APP_ID"};let fb={online:false,db:null,storage:null};try{const app=initializeApp(firebaseConfig);fb.db=getFirestore(app);fb.storage=getStorage(app);signInAnonymously(getAuth(app)).then(()=>fb.online=true).catch(()=>fb.online=false);}catch(e){fb.online=false;}window.fb=fb;
let store=getStore(); function openModal(id){q('#'+id).classList.add('open')} function closeModal(id){q('#'+id).classList.remove('open')}
function render(){q('#rxList').innerHTML=store.prescriptions.map(r=>`<div class="card"><div class="ch"><h2>روشتة — ${r.patientName}</h2><button class="btn btn-o btn-sm" onclick="window.print()">طباعة</button></div><div class="cb2 print-area"><div class="mini">${r.date} • ${r.doctor}</div><ul style="padding-right:20px;margin:12px 0">${r.items.map(i=>`<li><b>${i.name}</b> — ${i.dose} — ${i.days} يوم</li>`).join('')}</ul><p>${r.notes||''}</p></div></div>`).join('')||'<div class="empty">لا توجد روشتات</div>'}
function addItem(name='',dose='',days=7){const d=document.createElement('div');d.className='form-row';d.innerHTML=`<div class="fg"><label>الدواء</label><input class="med" value="${name}" list="meds"></div><div class="fg"><label>الجرعة</label><input class="dose" value="${dose}"></div><div class="fg"><label>الأيام</label><input class="days" type="number" value="${days}"></div>`;q('#items').appendChild(d)}
function applyTemplate(v){q('#items').innerHTML=''; if(v=='pain'){addItem('Celecoxib 200mg','قرص بعد الغداء',7);addItem('Pantoprazole 40mg','قرص قبل الإفطار',7)} if(v=='oa'){addItem('Glucosamine','قرص يوميًا',30);addItem('Vitamin D3','مرة أسبوعيًا',8)}}
function saveRx(){const p=store.patients.find(x=>x.id==q('#patient').value); const items=qa('#items .form-row').map(r=>({name:r.querySelector('.med').value,dose:r.querySelector('.dose').value,days:r.querySelector('.days').value})); store.prescriptions.unshift({id:uid('rx'),patientId:p.id,patientName:p.name,date:new Date().toISOString().slice(0,10),doctor:'د. أحمد المنصوري',items,notes:q('#notes').value}); saveStore(store); closeModal('rxMo'); render(); setTimeout(()=>window.print(),200)}
q('#patient').innerHTML=store.patients.map(p=>`<option value="${p.id}">${p.name}</option>`).join(''); document.body.insertAdjacentHTML('beforeend','<datalist id="meds"><option>Celecoxib 200mg</option><option>Diclofenac gel</option><option>Glucosamine</option><option>Vitamin D3</option><option>Calcium</option></datalist>'); window.openModal=openModal;window.closeModal=closeModal;window.addItem=addItem;window.applyTemplate=applyTemplate;window.saveRx=saveRx;render();
</script></body></html>
